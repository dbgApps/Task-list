<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis tareas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e4e8ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tareas">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#111;--done:#5c5c5c;--line:rgba(0,0,0,.16);--row:44px;--chrome:#eef1f4}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#e4e8ed;font:17px/1.2 "Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--ink);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
#card{position:relative;margin:12px;display:flex;flex-direction:column;background:var(--chrome);border-radius:14px;
  box-shadow:0 10px 30px rgba(30,40,60,.18),0 1px 3px rgba(30,40,60,.2);overflow:hidden;
  max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px)}
#top{display:flex;align-items:flex-end;padding:8px 8px 0;gap:4px}
#tabs{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;flex:1;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:10px 10px 0 0;padding:9px 14px 8px;margin-top:6px;font:inherit;font-weight:600;font-size:15px;
  color:var(--ink);cursor:pointer;opacity:.72;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on{opacity:1;margin-top:0;padding-top:12px}
.tab.drop{outline:3px solid var(--ink);outline-offset:-3px;opacity:1}
.ib{flex:none;width:38px;height:38px;margin-bottom:2px;border:0;border-radius:50%;background:transparent;font-size:20px;cursor:pointer;color:#333}
.ib:hover{background:rgba(0,0,0,.07)}
#list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;background-color:var(--bg,#FFF3B0);
  background-image:repeating-linear-gradient(to bottom,transparent 0 calc(var(--row) - 1px),var(--line) calc(var(--row) - 1px) var(--row));
  background-attachment:local;overscroll-behavior:contain}
.row{flex:none;height:var(--row);display:flex;align-items:center;gap:6px;padding:0 10px 1px 4px;position:relative}
.row.dragging{opacity:.3}
.row.before{box-shadow:inset 0 3px 0 var(--ink)}
.row.after{box-shadow:inset 0 -3px 0 var(--ink)}
.grip{flex:none;width:28px;height:36px;display:grid;place-items:center;color:#666;font-size:20px;cursor:grab;touch-action:none;user-select:none}
.row.new .grip{visibility:hidden}
.cb{flex:none;appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;border:2px solid #333;border-radius:6px;
  background:rgba(255,255,255,.55);display:grid;place-items:center;cursor:pointer}
.cb:checked{background:#333}
.cb:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tx{flex:1;min-width:0;height:100%;border:0;background:transparent;font:inherit;color:var(--ink);padding:0 4px;outline:none;
  -webkit-touch-callout:none}
.tx:focus{background:rgba(255,255,255,.5);border-radius:6px}
.row.done .tx{color:var(--done);text-decoration:line-through}
.row.new .cb{border-style:dashed;background:transparent;font-size:18px;line-height:1;color:#333;cursor:pointer}
.mic{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.55);font-size:17px;cursor:pointer}
.mic.on{background:#111;color:#fff}
.fill{flex:1;min-height:var(--row);cursor:text}
#foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 38px 8px 14px;font-size:14px;color:#333;background:var(--chrome)}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.sw input{appearance:none;-webkit-appearance:none;width:38px;height:22px;margin:0;border-radius:11px;background:#b9c0c8;position:relative;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:#333}
.sw input:checked::after{transform:translateX(16px)}
#grip{position:absolute;z-index:10;right:0;bottom:0;width:34px;height:34px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 0 50%,#9aa3ad 50% 56%,transparent 56% 66%,#9aa3ad 66% 72%,transparent 72% 82%,#9aa3ad 82% 88%,transparent 88%)}
.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.28);border-radius:8px;opacity:.95}
dialog{border:0;border-radius:14px;padding:18px;width:min(340px,calc(100vw - 32px));box-shadow:0 16px 40px rgba(0,0,0,.3);font:inherit;color:var(--ink)}
dialog::backdrop{background:rgba(20,30,45,.4)}
dialog p{margin:0 0 16px}
dialog label{display:block;font-size:14px;margin-bottom:6px;color:#444}
dialog input[type=text]{width:100%;font:inherit;padding:9px 10px;border:1.5px solid #b9c0c8;border-radius:8px;margin-bottom:14px}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn{font:inherit;font-weight:600;font-size:15px;padding:9px 14px;border:0;border-radius:8px;background:#e4e8ed;color:var(--ink);cursor:pointer}
.btn.pri{background:#111;color:#fff}
.btn.danger{background:#ffd9d9;color:#8a1111;margin-right:auto}
.sws{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sws button{height:38px;border-radius:8px;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sws button[aria-pressed=true]{border-color:#111}
.nbtn{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:transparent;font-size:24px;font-weight:700;color:#222;cursor:pointer;opacity:.9;line-height:1}
.nbtn.on{background:#111;color:#fff;opacity:1}
.mi{display:block;width:100%;text-align:left;font:inherit;padding:13px 12px;border:0;background:#f1f3f6;border-radius:8px;margin-bottom:6px;cursor:pointer;color:var(--ink)}
.mi.danger{background:#ffd9d9;color:#8a1111}
#dmTitle{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbtn:hover,.nbtn:focus-visible{opacity:1;background:rgba(255,255,255,.55)}
.nic{flex:none;font-size:17px}
.ntitle{line-height:42px;white-space:nowrap;overflow:hidden;cursor:pointer;font-weight:600}
.ib.on{background:#111;color:#fff}
#note{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:var(--bg,#FFF3B0)}
#note[hidden]{display:none}
#nh{flex:none;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 6px;border-bottom:2px solid rgba(0,0,0,.22)}
#nh .ib{margin:0}
#nTitle{flex:1;min-width:0;font:inherit;font-size:20px;font-weight:700;border:0;background:transparent;padding:6px;outline:none;border-radius:6px;color:var(--ink)}
#nTitle:focus{background:rgba(255,255,255,.5)}
#nBody{flex:1;min-height:0;border:0;resize:none;outline:none;font:inherit;line-height:32px;color:var(--ink);padding:0 16px 40px;
  background-color:transparent;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);background-attachment:local}
:focus-visible{outline:2px solid #111;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="card">
  <div id="top">
    <div id="tabs" role="tablist"></div>
    <button class="ib" id="addTab" title="Añadir pestaña" aria-label="Añadir pestaña">＋</button>
    <button class="ib" id="editTab" title="Editar pestaña" aria-label="Editar pestaña">✎</button>
  </div>
  <div id="list"></div>
  <div id="foot">
    <span><span id="count"></span> <small style="opacity:.6">v4</small></span>
    <label class="sw"><input type="checkbox" id="showDone"> Mostrar completadas</label>
  </div>
  <section id="note" hidden aria-label="Nota">
    <div id="nh"><button class="ib" id="nBack" aria-label="Volver">←</button>
      <input id="nTitle" type="text" maxlength="200" autocomplete="off" aria-label="Título de la nota">
      <button class="ib" id="nMic" aria-label="Dictar">🎤</button></div>
    <textarea id="nBody" placeholder="Escribe la nota…" aria-label="Texto de la nota"></textarea>
  </section>
  <div id="grip" title="Cambiar tamaño" aria-label="Cambiar tamaño"></div>
</main>

<dialog id="dc"><form method="dialog"><p id="dcMsg"></p>
  <div class="btns"><button class="btn" value="no">Cancelar</button><button class="btn pri" value="yes" id="dcOk">Borrar</button></div></form></dialog>

<dialog id="dm"><form method="dialog"><p id="dmTitle"></p><div id="dmItems"></div>
  <div class="btns"><button class="btn">Cerrar</button></div></form></dialog>

<dialog id="dt"><form method="dialog">
  <label for="tn">Nombre de la pestaña</label><input type="text" id="tn" maxlength="30" autocomplete="off">
  <label>Color</label><div class="sws" id="sws"></div>
  <div class="btns"><button class="btn danger" type="button" id="delTab">Borrar pestaña</button><button class="btn pri" value="ok">Listo</button></div>
</form></dialog>

<script>
const COLORS=['#FFD6E0','#FFE2C2','#FFF3B0','#D8F5C8','#C6F1E4','#CFE6FF','#E1D6FF','#E6E6E6'];
const KEY='tareas-pwa-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const $=id=>document.getElementById(id);
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};

let S=load();
function load(){
  let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!s||!Array.isArray(s.tabs)||!s.tabs.length)s={tabs:[{id:uid(),name:'Tareas',color:COLORS[2],tasks:[]}],active:null,showDone:true,w:null,h:null};
  if(!s.tabs.some(t=>t.id===s.active))s.active=s.tabs[0].id;
  return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const cur=()=>S.tabs.find(t=>t.id===S.active);

/* ---------- diálogos ---------- */
function ask(msg,ok='Borrar'){return new Promise(res=>{$('dcOk').textContent=ok;
  $('dcMsg').textContent=msg;const d=$('dc');d.returnValue='';
  d.onclose=()=>res(d.returnValue==='yes');d.showModal();
})}

/* ---------- render ---------- */
let ni=null,commitNew=null,suppress=false,openK=null,dict=null;
function render(){renderTabs();renderList();applySize()}

function renderTabs(){
  const box=$('tabs');box.innerHTML='';
  S.tabs.forEach(t=>{
    const b=el('button','tab'+(t.id===S.active?' on':''));
    b.dataset.id=t.id;b.style.background=t.color;b.textContent=t.name;b.setAttribute('role','tab');
    b.onclick=()=>{S.active=t.id;save();render()};
    box.append(b);
  });
  const on=box.querySelector('.on');if(on)on.scrollIntoView({inline:'nearest',block:'nearest'});
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function renderList(){
  const t=cur(),list=$('list');
  list.style.setProperty('--bg',t.color);
  list.innerHTML='';
  t.tasks.forEach(k=>{if(S.showDone||!k.done)list.append(rowEl(k))});

  const nr=el('div','row new');
  nr.append(el('span','grip'));
  const plus=el('button','cb');plus.type='button';plus.textContent='+';plus.setAttribute('aria-label','Añadir tarea');
  const me=ni=el('input','tx');me.type='text';me.placeholder='Nueva tarea…';me.enterKeyHint='done';me.autocomplete='off';
  me.setAttribute('aria-label','Nueva tarea');
  const commit=focus=>{const v=me.value.trim();me.value='';if(!v)return;
    const k={id:uid(),text:v,done:false};cur().tasks.push(k);save();nr.before(rowEl(k));updateCount();if(focus)me.focus()};
  commitNew=commit;
  const open=()=>{if(document.activeElement===me)me.blur();me.focus()};
  me.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();stopDict();commit(true)}};
  me.onblur=()=>{setTimeout(()=>{if(document.activeElement!==me&&!(dict&&dict.input===me))commit(false)},0)};
  plus.onpointerdown=e=>e.preventDefault();
  plus.onclick=()=>{if(me.value.trim())commit(true);else open()};
  nr.addEventListener('click',e=>{if(e.target!==me&&e.target!==plus&&!e.target.closest('.mic'))open()});
  nr.append(plus,me);
  if(SR){
    const mic=el('button','mic');mic.type='button';mic.textContent='🎤';mic.setAttribute('aria-label','Dictar tarea');
    mic.onpointerdown=e=>e.preventDefault();
    mic.onclick=()=>toggleDict(me,mic,[nr]);
    nr.append(mic);
  }
  list.append(nr);
  const fill=el('div','fill');fill.onclick=open;list.append(fill);
  updateCount();
}

function updateCount(){
  const n=cur().tasks.filter(k=>!k.done).length;
  $('count').textContent=n===1?'1 pendiente':n+' pendientes';
}

/* con ratón: al pasar por encima de un texto largo, se desplaza para verlo entero */
function hoverScroll(n){
  n.addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse'||document.activeElement===n)return;
    const m=n.scrollWidth-n.clientWidth;if(m<=0)return;
    const r=n.getBoundingClientRect();
    n.scrollLeft=m*Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  });
  n.addEventListener('pointerleave',()=>{if(document.activeElement!==n)n.scrollLeft=0});
}

function rowEl(k){
  const r=el('div','row'+(k.done?' done':'')+(k.note?' note':''));r.dataset.id=k.id;
  const g=el('span','grip');g.textContent='⠿';g.setAttribute('aria-label','Arrastrar para ordenar o mover');
  const cb=el('input','cb');cb.type='checkbox';cb.checked=k.done;cb.setAttribute('aria-label','Completada');
  cb.onchange=()=>{k.done=cb.checked;save();if(!S.showDone&&k.done)r.remove();else r.classList.toggle('done',k.done);updateCount()};
  r.append(g,cb);
  let tx;
  if(k.note){
    const ic=el('span','nic');ic.textContent='📝';ic.setAttribute('aria-hidden','true');
    tx=el('div','tx ntitle');tx.textContent=k.text;tx.tabIndex=0;tx.setAttribute('role','button');
    tx.onclick=()=>{if(suppress){suppress=false;return}openNote(k)};
    tx.onkeydown=e=>{if(e.key==='Enter')openNote(k)};
    r.append(ic,tx);
  }else{
    tx=el('input','tx');tx.type='text';tx.value=k.text;tx.autocomplete='off';tx.enterKeyHint='done';
    tx.onfocus=()=>{tx.dataset.old=k.text};
    tx.oninput=()=>{k.text=tx.value;save()};
    tx.onblur=()=>{const v=tx.value.trim();if(!v){k.text=tx.dataset.old;tx.value=k.text}else{k.text=v;tx.value=v}save()};
    tx.onkeydown=e=>{if(e.key==='Enter')tx.blur()};
    r.append(tx);
  }
  const mb=el('button','nbtn');mb.type='button';mb.textContent='⋮';mb.title='Opciones';mb.setAttribute('aria-label','Opciones de la '+(k.note?'nota':'tarea'));
  mb.onclick=()=>openMenu(k,tx,mb,r);
  r.append(mb);
  hoverScroll(tx);
  r.oncontextmenu=e=>e.preventDefault();
  r.addEventListener('pointerdown',e=>{if(e.target===g||e.target===cb||e.target.closest('.nbtn'))return;longPress(e,k)});
  g.addEventListener('pointerdown',e=>startDrag(e,r,k,g));
  return r;
}

/* ---------- dictado continuo: no se cierra hasta pulsar fuera ---------- */
function startDict(input,btn,zone){
  stopDict();
  const d=dict={input,btn,zone,base:input.value,fin:'',rec:null,active:true};
  const show=it=>{
    const p=[d.fin,it.trim()].filter(Boolean).join(' ');
    input.value=p?(d.base&&!/\s$/.test(d.base)?d.base+' ':d.base)+p:d.base;
    input.dispatchEvent(new Event('input'));
  };
  const begin=()=>{
    if(!d.active)return;
    const rec=d.rec=new SR();rec.lang='es-ES';rec.continuous=true;rec.interimResults=true;
    rec.onresult=e=>{
      if(!d.active)return;let it='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const r=e.results[i];
        if(r.isFinal)d.fin+=(d.fin?' ':'')+r[0].transcript.trim();else it+=r[0].transcript;
      }
      show(it);
    };
    rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')stopDict()};
    rec.onend=()=>{if(d.active)setTimeout(begin,150)};
    try{rec.start()}catch(_){}
  };
  d.user=()=>stopDict();
  input.addEventListener('keydown',d.user);input.addEventListener('pointerdown',d.user);
  btn.classList.add('on');begin();
}
function stopDict(){
  const d=dict;if(!d)return;dict=null;d.active=false;
  d.btn.classList.remove('on');
  d.input.removeEventListener('keydown',d.user);d.input.removeEventListener('pointerdown',d.user);
  try{d.rec&&d.rec.stop()}catch(_){}
}
function toggleDict(input,btn,zone){if(dict&&dict.btn===btn)stopDict();else startDict(input,btn,zone)}
document.addEventListener('pointerdown',e=>{
  if(!dict||dict.zone.some(z=>z.contains(e.target)))return;
  const isNew=dict.input===ni;stopDict();
  if(isNew&&commitNew){commitNew(false);ni.blur()}
},true);

/* ---------- menú de opciones de cada línea ---------- */
function openMenu(k,tx,btn,r){
  stopDict();
  $('dmTitle').textContent=(k.note?'Nota: ':'')+k.text;
  const box=$('dmItems');box.innerHTML='';
  const add=(label,fn,cls)=>{
    const b=el('button','mi'+(cls?' '+cls:''));b.type='button';b.textContent=label;
    b.onclick=()=>{$('dm').close();setTimeout(fn,0)};box.append(b);
  };
  if(k.note){
    add('📖  Abrir nota',()=>openNote(k));
    add('⌨️  Editar título',()=>{openNote(k);setTimeout(()=>{const t=$('nTitle');t.focus();t.setSelectionRange(t.value.length,t.value.length)},0)});
  }else{
    add('⌨️  Editar con el teclado',()=>{tx.focus();const n=tx.value.length;tx.setSelectionRange(n,n)});
    if(SR)add('🎤  Añadir texto por voz',()=>startDict(tx,btn,[r]));
    add('📝  Convertir en nota',async()=>{
      if(await ask('¿Convertir «'+k.text+'» en nota? Una nota no se puede volver a convertir en tarea.','Convertir')){
        k.note=true;k.body='';save();renderList();
      }
    });
  }
  add('🗑️  Borrar',async()=>{
    if(await ask('¿Borrar '+(k.note?'la nota':'la tarea')+' «'+k.text+'»?')){
      const c=cur();c.tasks=c.tasks.filter(z=>z!==k);save();renderList();
    }
  },'danger');
  $('dm').showModal();
}

/* ---------- notas ---------- */
function openNote(k){
  openK=k;const n=$('note');n.style.setProperty('--bg',cur().color);
  $('nTitle').value=k.text;$('nBody').value=k.body||'';n.hidden=false;
  history.pushState({n:1},'');
  if(!k.body)$('nBody').focus();
}
function closeNote(){stopDict();const k=openK;openK=null;$('note').hidden=true;renderList()}
$('nBack').onclick=()=>history.back();
addEventListener('popstate',()=>{if(openK)closeNote()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&openK)history.back()});
$('nTitle').oninput=()=>{if(openK&&$('nTitle').value.trim()){openK.text=$('nTitle').value;save()}};
$('nTitle').onblur=()=>{if(!openK)return;if(!$('nTitle').value.trim())$('nTitle').value=openK.text;save()};
$('nBody').oninput=()=>{if(openK){openK.body=$('nBody').value;save()}};
if(SR)$('nMic').onclick=()=>toggleDict($('nBody'),$('nMic'),[$('nMic'),$('nBody')]);
else $('nMic').style.display='none';

/* ---------- pulsación larga: borrar ---------- */
function longPress(e,k){
  suppress=false;
  const x=e.clientX,y=e.clientY;
  const t=setTimeout(async()=>{
    cancel();suppress=true;if(document.activeElement)document.activeElement.blur();
    navigator.vibrate&&navigator.vibrate(30);
    if(await ask('¿Borrar '+(k.note?'la nota':'la tarea')+' «'+k.text+'»?')){
      const t2=cur();t2.tasks=t2.tasks.filter(z=>z!==k);save();renderList();
    }
  },1200);
  const mv=ev=>{if(Math.hypot(ev.clientX-x,ev.clientY-y)>10)cancel()};
  function cancel(){clearTimeout(t);removeEventListener('pointermove',mv);removeEventListener('pointerup',cancel);removeEventListener('pointercancel',cancel)}
  addEventListener('pointermove',mv);addEventListener('pointerup',cancel);addEventListener('pointercancel',cancel);
}

/* ---------- arrastrar: ordenar y mover entre pestañas ---------- */
function startDrag(e,row,k,grip){
  e.preventDefault();
  grip.setPointerCapture(e.pointerId);
  const rect=row.getBoundingClientRect(),dy=e.clientY-rect.top,dx=e.clientX-rect.left;
  const ghost=row.cloneNode(true);ghost.classList.add('ghost');
  ghost.style.width=rect.width+'px';ghost.style.left=rect.left+'px';ghost.style.top=rect.top+'px';
  ghost.style.background=cur().color;
  document.body.append(ghost);row.classList.add('dragging');
  let drop=null;
  const clear=()=>{document.querySelectorAll('.before,.after,.drop').forEach(n=>n.classList.remove('before','after','drop'))};
  const move=ev=>{
    ghost.style.left=(ev.clientX-dx)+'px';ghost.style.top=(ev.clientY-dy)+'px';
    clear();drop=null;
    const t=document.elementFromPoint(ev.clientX,ev.clientY);if(!t)return;
    const tab=t.closest('.tab'),r=t.closest('.row:not(.new)');
    if(tab&&tab.dataset.id!==S.active){tab.classList.add('drop');drop={tab:tab.dataset.id}}
    else if(r&&r.dataset.id!==k.id){
      const b=r.getBoundingClientRect(),after=ev.clientY>b.top+b.height/2;
      r.classList.add(after?'after':'before');drop={id:r.dataset.id,after};
    }else if(t.closest('#list')&&!r)drop={end:true};
  };
  const up=()=>{
    grip.removeEventListener('pointermove',move);grip.removeEventListener('pointerup',up);grip.removeEventListener('pointercancel',up);
    ghost.remove();clear();
    if(drop){
      const c=cur();c.tasks=c.tasks.filter(z=>z!==k);
      if(drop.tab)S.tabs.find(t=>t.id===drop.tab).tasks.push(k);
      else if(drop.end)c.tasks.push(k);
      else{let i=c.tasks.findIndex(z=>z.id===drop.id);if(i<0)i=c.tasks.length;if(drop.after)i++;c.tasks.splice(i,0,k)}
      save();
    }
    renderList();
  };
  grip.addEventListener('pointermove',move);grip.addEventListener('pointerup',up);grip.addEventListener('pointercancel',up);
}

/* ---------- pestañas ---------- */
let editing=null;
function openTab(t){
  editing=t;$('tn').value=t.name;
  const box=$('sws');box.innerHTML='';
  COLORS.forEach(c=>{
    const b=el('button');b.type='button';b.style.background=c;b.setAttribute('aria-label','Color '+c);
    b.setAttribute('aria-pressed',String(c===t.color));
    b.onclick=()=>{t.color=c;[...box.children].forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');save();render()};
    box.append(b);
  });
  $('delTab').style.display=S.tabs.length>1?'':'none';
  $('dt').showModal();$('tn').select();
}
$('tn').oninput=()=>{if(editing){editing.name=$('tn').value;save();renderTabs()}};
$('dt').onclose=()=>{if(editing&&!editing.name.trim()){editing.name='Pestaña';save()}editing=null;render()};
$('editTab').onclick=()=>openTab(cur());
$('addTab').onclick=()=>{
  const used=S.tabs.map(t=>t.color),color=COLORS.find(c=>!used.includes(c))||COLORS[S.tabs.length%COLORS.length];
  const t={id:uid(),name:'Nueva pestaña',color,tasks:[]};
  S.tabs.push(t);S.active=t.id;save();render();openTab(t);
};
$('delTab').onclick=async()=>{
  const t=editing;if(!t)return;
  const msg=t.tasks.length?'¿Borrar la pestaña «'+t.name+'» y sus '+t.tasks.length+' tareas?':'¿Borrar la pestaña «'+t.name+'»?';
  editing=null;$('dt').close();
  if(await ask(msg)){S.tabs=S.tabs.filter(x=>x!==t);S.active=S.tabs[0].id;save();render()}
};

/* ---------- mostrar/ocultar completadas ---------- */
$('showDone').checked=S.showDone;
$('showDone').onchange=e=>{S.showDone=e.target.checked;save();renderList()};

/* ---------- tamaño ajustable ---------- */
function applySize(){
  const c=$('card');
  const w=S.w||Math.min(560,innerWidth-24),h=S.h||Math.min(680,innerHeight-24);
  c.style.width=w+'px';c.style.height=h+'px';
}
$('grip').addEventListener('pointerdown',e=>{
  e.preventDefault();const g=$('grip'),c=$('card');g.setPointerCapture(e.pointerId);
  const x=e.clientX,y=e.clientY,w0=c.offsetWidth,h0=c.offsetHeight;
  const mv=ev=>{
    S.w=Math.max(280,Math.min(innerWidth-24,w0+ev.clientX-x));
    S.h=Math.max(300,Math.min(innerHeight-24,h0+ev.clientY-y));applySize();
  };
  const up=()=>{g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);save()};
  g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
});
addEventListener('resize',applySize);

render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
